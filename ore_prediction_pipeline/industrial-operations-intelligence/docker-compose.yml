services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      IOP_PG_HOST: postgres
    volumes:
      - .:/workspace
      # config/local.yaml's raw_csv ("../MiningProcess_...csv") resolves to
      # /MiningProcess_...csv given working_dir /workspace; only this one
      # file from the parent folder is mounted, not the whole parent dir.
      - ../MiningProcess_Flotation_Plant_Database.csv:/MiningProcess_Flotation_Plant_Database.csv:ro
    working_dir: /workspace
    ports:
      - "8501:8501"
    # No default command: this service exists for `docker compose run --rm app <cmd>`
    # (pytest, ruff, iop.cli, streamlit) via the Makefile, not for `docker compose up`.
    command: ["sleep", "infinity"]

volumes:
  pgdata:
