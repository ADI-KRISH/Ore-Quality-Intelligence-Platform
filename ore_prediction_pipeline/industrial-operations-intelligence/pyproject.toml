[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iop"
version = "0.1.0"
description = "Industrial Operations Intelligence Platform - flotation-plant silica soft-sensor"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "xgboost>=2.1,<3",
    "shap>=0.46,<1",
    "mlflow>=2.16,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
iop = "iop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
