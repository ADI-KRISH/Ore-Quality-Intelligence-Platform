name: CI

on:
  push:
    paths:
      - "ore_prediction_pipeline/industrial-operations-intelligence/**"
  pull_request:
    paths:
      - "ore_prediction_pipeline/industrial-operations-intelligence/**"

defaults:
  run:
    working-directory: ore_prediction_pipeline/industrial-operations-intelligence

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest
        run: pytest -q
